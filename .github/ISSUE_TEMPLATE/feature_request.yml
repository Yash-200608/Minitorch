name: Feature request
description: Propose an educational or research improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Core MiniTorch is complete through Phase S. New work should be an
        optional research track, not a rewrite of Phases A-S.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Prefer composing existing APIs over adding a new subsystem.
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Closest optional track
      options:
        - Advanced QAT
        - Native performance
        - Storage
        - Glass Box UX
        - Research algorithms
        - Docs / tooling
        - Other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: I am not proposing GPU or distributed training as a required phase.
        - label: Claims will be scoped to measurements, not marketing language.
